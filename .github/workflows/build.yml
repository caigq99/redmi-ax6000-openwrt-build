name: Build Redmi AX6000 OpenClash

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.layout }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        layout: [uboot, stock]
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Build firmware (${{ matrix.layout }})
        env:
          LAYOUT: ${{ matrix.layout }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e LAYOUT \
            ubuntu:20.04 \
            bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -y
              apt-get install -y \
                ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
                bzip2 ca-certificates ccache clang clangd cmake cpio curl device-tree-compiler ecj \
                fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man \
                intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
                libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 libncursesw5-dev libreadline-dev \
                libssl-dev libtool lld lldb lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
                pkgconf python2.7 python3 python3-pip python3-ply python3-setuptools python3-docutils \
                qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
                unzip vim wget xmlto xxd zlib1g-dev
              HOST_UID=$(stat -c %u /work)
              useradd -m -u "$HOST_UID" builder
              su builder -s /bin/bash -c "bash /work/scripts/build.sh $LAYOUT"
            '

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax6000-openclash-${{ matrix.layout }}
          path: |
            src/bin/targets/mediatek/mt7986/*.bin
            src/bin/targets/mediatek/mt7986/*.manifest
            src/bin/targets/mediatek/mt7986/sha256sums
          if-no-files-found: error
          retention-days: 14
